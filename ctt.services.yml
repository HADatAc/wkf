services:
  ctt.hasco_client:
    class: Drupal\ctt\Service\CttHascoClient
    arguments:
      - '@http_client'
      - '@config.factory'
      - '@key.repository'
      - '@logger.factory'

  ctt.workflow_layout_exporter:
    class: Drupal\ctt\Service\WorkflowLayoutExporter
    arguments:
      - '@ctt.hasco_client'
      - '@logger.factory'

  ctt.wkf_metadata_extractor:
    class: Drupal\ctt\Service\WkfMetadataExtractor
    arguments:
      - '@file_system'
      - '@logger.factory'
      - '@ctt.hasco_client'
