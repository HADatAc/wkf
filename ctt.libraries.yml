# CTT React Editor - main library bundle
ctt-editor-app:
  version: 1.7
  css:
    theme:
      dist/workflow-editor.css: {}
      css/ctt-node-width-override.css: {}
  js:
    js/process-polyfill.js: {}
    dist/hasco-workflow-editor.umd.js: { minified: true }
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once

# CTT Editor init - Drupal behavior that bootstraps the React app
ctt-editor-init:
  version: 2.1
  css:
    theme:
      css/ctt-embed-layout-v20260806.css: {}
      css/ctt-task-width-override.css: {}
  js:
    js/ctt-init-v20260806.js: {}
  dependencies:
    - ctt/ctt-editor-app
    - core/drupal
    - core/drupalSettings
    - core/once

ctt-tools-repository:
  version: 1.x
  css:
    theme:
      css/ctt-tools-repository.css: {}
  js:
    js/ctt-tools-repository.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once

ctt-r-analysis:
  version: 1.x
  css:
    theme:
      css/ctt-r-analysis.css: {}
  js:
    js/ctt-r-analysis.js: {}
  dependencies:
    - core/jquery
    - core/drupal
    - core/drupal.autocomplete
    - core/drupalSettings
    - core/once
